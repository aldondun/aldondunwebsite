<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Varani Aldama Diru ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #5a1730;
      overflow: hidden;
    }
    .heart {
      position: fixed;
      color: rgba(255,255,255,.65);
      font-size: 24px;
      animation: float 6s linear infinite;
      pointer-events: none;
    }
    @keyframes float {
      from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      to { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
    }
    .card {
      width: min(92%, 520px);
      padding: 34px 28px;
      background: rgba(255,255,255,.94);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(100, 20, 50, .25);
      text-align: center;
      position: relative;
      z-index: 2;
    }
    h1 { margin: 0 0 12px; font-size: 30px; }
    .intro { font-size: 18px; line-height: 1.5; margin-bottom: 28px; }
    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin: 16px 0 8px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #ffd0dc;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
    }
    input:focus { border-color: #ff5f83; }
    .question {
      font-size: 21px;
      font-weight: bold;
      margin: 25px 0 18px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }
    #yes { background: #25d366; color: white; }
    #no { background: #eee; color: #555; }
    button:hover { transform: scale(1.05); }
    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #888;
    }
    #message {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 14px;
      background: #fff0f4;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="heart" style="left:8%; animation-delay:0s;">♥</div>
  <div class="heart" style="left:25%; animation-delay:2s;">♥</div>
  <div class="heart" style="left:48%; animation-delay:4s;">♥</div>
  <div class="heart" style="left:70%; animation-delay:1s;">♥</div>
  <div class="heart" style="left:88%; animation-delay:3s;">♥</div>

  <main class="card">
    <h1>Hai, Varani Aldama Diru Sayang ❤️</h1>
    <p class="intro">
      Ada sedikit pertanyaan spesial untuk kamu.<br>
      Jawab dengan jujur ya 😊
    </p>

    <label for="barang">1. Masukan nama barang</label>
    <input id="barang" type="text" placeholder="Contoh: Tumbler, boneka, dll.">

    <div class="question">
      2. Apakah kamu sayang Aldo Ndun? ❤️
    </div>

    <div class="buttons">
      <button id="yes" onclick="jawabYa()">YA ❤️</button>
      <button id="no" onclick="jawabTidak()">TIDAK 😜</button>
    </div>

    <div id="message"></div>

    <p class="note">Dibuat khusus untuk Varani Aldama Diru 💕</p>
  </main>

  <script>
    const nomorWhatsApp = "6281233782784";

    function jawabYa() {
      const barang = document.getElementById("barang").value.trim();
      const pesan =
        "Hai Aldo ❤️%0A%0A" +
        "Aku, Varani Aldama Diru, menjawab: YA, aku sayang Aldo Ndun! ❤️%0A" +
        "Nama barang: " + encodeURIComponent(barang || "(belum diisi)");

      window.location.href = "https://wa.me/" + nomorWhatsApp + "?text=" + pesan;
    }

    function jawabTidak() {
      const message = document.getElementById("message");
      message.style.display = "block";
      message.textContent = "Yahhh 😭 coba pikir-pikir lagi deh... ❤️";
    }
  </script>

</body>
</html>
